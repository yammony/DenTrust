<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="format-detection" content="telephone=no">
<title>DenTrust</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --blue:#00a8ff;
    --blue-light:#38bdf8;
    --black:#000000;
    --whatsapp:#25D366;
    --bg:#f5f8fb;
    --card-bg:#ffffff;
    --shadow:0 4px 18px rgba(0,0,0,0.08);
    --radius:16px;
    --green-active:#16a34a;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{
    width:100%;
    overflow-x:hidden;
    touch-action:manipulation;
  }
  body{
    font-family:'Tajawal', sans-serif;
    background:var(--bg);
    color:#111;
    direction:rtl;
    padding-bottom:60px;
  }
  a{text-decoration:none; color:inherit;}
  button{
    font-family:'Tajawal', sans-serif;
    cursor:pointer;
    border:none;
    -webkit-appearance:none;
    appearance:none;
    white-space:normal;
  }

  /* ===== HEADER ===== */
  .site-header{
    background:var(--card-bg);
    box-shadow:var(--shadow);
    padding:14px 16px 20px;
    position:relative;
    z-index:10;
  }
  .header-top-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    margin-top:10px;
    flex-wrap:wrap;
  }
  .whatsapp-btn{
    display:flex;
    align-items:center;
    gap:8px;
    background:#fff;
    border:2px solid var(--whatsapp);
    padding:8px 14px;
    border-radius:999px;
    box-shadow:var(--shadow);
    transition:transform .2s ease, background .2s ease;
  }
  .whatsapp-btn:hover{
    transform:translateY(-2px);
    background:#eafff1;
  }
  .whatsapp-btn .wa-icon{
    width:26px;
    height:26px;
    border-radius:50%;
    background:var(--whatsapp);
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
  }
  .whatsapp-btn .wa-icon svg{
    width:16px;
    height:16px;
    fill:#fff;
  }
  .whatsapp-btn span{
    color:#000;
    font-weight:700;
    font-size:14px;
    white-space:nowrap;
  }
  .instagram-btn{
    display:flex;
    align-items:center;
    gap:8px;
    background:#fff;
    border:2px solid transparent;
    background-image:linear-gradient(#fff,#fff), linear-gradient(45deg,#f9ce34,#ee2a7b,#6228d7);
    background-origin:border-box;
    background-clip:padding-box, border-box;
    padding:8px 14px;
    border-radius:999px;
    box-shadow:var(--shadow);
    transition:transform .2s ease;
  }
  .instagram-btn:hover{
    transform:translateY(-2px);
  }
  .instagram-btn .ig-icon{
    width:26px;
    height:26px;
    border-radius:8px;
    background:linear-gradient(45deg,#f9ce34,#ee2a7b,#6228d7);
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
  }
  .instagram-btn .ig-icon svg{
    width:16px;
    height:16px;
    fill:#fff;
  }
  .instagram-btn span{
    color:#000;
    font-weight:700;
    font-size:14px;
    white-space:nowrap;
  }
  .header-center{
    text-align:center;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
  }
  .logo{
    font-size:clamp(28px, 7vw, 42px);
    font-weight:900;
    letter-spacing:1px;
  }
  .logo .den{color:var(--black);}
  .logo .trust{color:var(--blue-light);}

  /* ===== HERO / MAIN CONTENT ===== */
  .hero{
    text-align:center;
    padding:34px 16px 10px;
  }
  .university{
    font-size:clamp(18px, 4.5vw, 26px);
    font-weight:800;
    color:#000;
    margin-bottom:14px;
  }
  .main-title{
    font-size:clamp(20px, 5vw, 30px);
    font-weight:800;
    color:var(--blue);
    margin-bottom:22px;
  }
  .main-subtitle{
    font-size:clamp(13px, 3.4vw, 16px);
    font-weight:700;
    color:#666;
    margin-bottom:20px;
  }

  /* ===== MAIN MENU ===== */
  .main-menu{
    display:grid;
    grid-template-columns:repeat(2, 1fr);
    gap:10px;
    max-width:420px;
    margin:0 auto 6px;
    padding:4px 8px 6px;
  }
  .menu-btn{
    background:#ffffff;
    color:#333;
    font-weight:700;
    font-size:14px;
    line-height:1.4;
    padding:15px 8px;
    border-radius:999px;
    box-shadow:var(--shadow);
    border:2px solid transparent;
    transition:all .25s ease;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    white-space:normal;
    word-break:keep-all;
    overflow-wrap:break-word;
    overflow:visible;
    min-height:78px;
    width:100%;
  }
  .menu-plain-line{
    display:block;
    width:100%;
    white-space:nowrap;
  }
  .kashida-pair{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
  }
  .menu-btn:hover{
    border-color:var(--blue-light);
  }
  .menu-btn.active{
    background:#000000;
    color:#fff;
    box-shadow:0 6px 16px rgba(0,0,0,0.35);
  }
  @media (min-width:720px){
    .menu-btn{ font-size:16px; padding:17px 10px; min-height:82px; }
  }
  @media (max-width:340px){
    .menu-btn{ font-size:12.5px; }
  }

  .years-tabs{
    display:flex;
    flex-direction:row;
    flex-wrap:wrap;
    justify-content:center;
    gap:10px;
    padding:0 12px;
    margin-bottom:18px;
  }
  .year-tab{
    background:#ffffff;
    color:#333;
    font-weight:700;
    font-size:15px;
    padding:12px 18px;
    border-radius:999px;
    box-shadow:var(--shadow);
    transition:all .25s ease;
    border:2px solid transparent;
    white-space:nowrap;
  }
  .year-tab:hover{
    border-color:var(--blue-light);
  }
  .year-tab.active{
    background:#000000;
    color:#fff;
    box-shadow:0 6px 16px rgba(0,0,0,0.35);
  }

  .semesters-wrap{
    max-width:900px;
    margin:0 auto;
    padding:0 16px;
  }
  .semester-title{
    text-align:center;
    font-size:18px;
    font-weight:800;
    color:var(--blue);
    margin:18px 0 12px;
  }
  .semesters-tabs{
    display:flex;
    justify-content:center;
    gap:12px;
    margin-bottom:26px;
    flex-wrap:wrap;
  }
  .semester-tab{
    background:#ffffff;
    color:#333;
    font-weight:700;
    font-size:15px;
    padding:12px 18px;
    border-radius:999px;
    box-shadow:var(--shadow);
    border:2px solid transparent;
    transition:all .25s ease;
    white-space:nowrap;
  }
  .semester-tab:hover{
    border-color:var(--blue-light);
  }
  .semester-tab.active{
    background:#000000;
    color:#fff;
    box-shadow:0 6px 16px rgba(0,0,0,0.35);
  }

  /* ===== CONTENT AREA ===== */
  #content-area{
    max-width:900px;
    margin:0 auto;
    padding:0 16px 40px;
  }

  .message-box{
    background:#fff;
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:40px 20px;
    text-align:center;
    font-size:20px;
    font-weight:700;
    color:#000000;
    line-height:1.8;
  }

  /* ===== GALLERY ===== */
  .gallery-wrap{
    margin-bottom:22px;
  }
  .gallery{
    position:relative;
    width:100%;
    aspect-ratio:1/1.05;
    border-radius:var(--radius);
    overflow:hidden;
    box-shadow:var(--shadow);
    background:#dbe9f5;
    touch-action:pan-y;
    user-select:none;
  }
  .gallery-track{
    display:flex;
    direction:ltr;
    width:100%;
    height:100%;
    will-change:transform;
  }
  .gallery-track.snap{
    transition:transform .3s ease;
  }
  .gallery-slide{
    min-width:100%;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    direction:rtl;
    background:linear-gradient(135deg,#dbe9f5,#c7dff2);
    font-size:16px;
    font-weight:700;
    color:#4a6a85;
    cursor:zoom-in;
    text-align:center;
    padding:10px;
    overflow:hidden;
  }
  .gallery-slide img{
    width:100%;
    height:100%;
    object-fit:cover;
    pointer-events:none;
    -webkit-user-drag:none;
    -webkit-touch-callout:none;
    touch-action:none;
  }
  .gallery-dots{
    position:absolute;
    bottom:12px;
    left:50%;
    transform:translateX(-50%);
    direction:ltr;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:7px;
    z-index:4;
  }
  .gallery-dot{
    width:7px;
    height:7px;
    border-radius:50%;
    background:#c9c9c9;
    transition:all .2s ease;
  }
  .gallery-dot.active{
    background:#000000;
    width:9px;
    height:9px;
  }

  /* ===== MODAL ===== */
  .modal-overlay{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.9);
    z-index:1000;
    flex-direction:column;
    align-items:center;
    justify-content:center;
  }
  .modal-overlay.open{ display:flex; }
  .modal-content{
    position:relative;
    width:92%;
    max-width:800px;
    aspect-ratio:1/1.05;
    display:flex;
    align-items:center;
    justify-content:center;
    touch-action:none;
    user-select:none;
    overflow:hidden;
  }
  .modal-content .gallery-track{
    direction:ltr;
  }
  .modal-content .gallery-slide{
    border-radius:12px;
    cursor:default;
    touch-action:none;
  }
  .modal-content .gallery-slide img{
    pointer-events:auto;
    transform-origin:center center;
    object-fit:contain;
    touch-action:none;
    -webkit-touch-callout:none;
  }
  .modal-dots{
    position:absolute;
    bottom:14px;
    left:50%;
    transform:translateX(-50%);
    direction:ltr;
    display:none;
    justify-content:center;
    align-items:center;
    gap:8px;
    z-index:5;
  }
  .modal-dots .gallery-dot{
    background:#c9c9c9;
  }
  .modal-dots .gallery-dot.active{
    background:#000000;
  }
  .modal-close{
    position:fixed;
    top:18px;
    right:18px;
    color:#fff;
    font-size:32px;
    font-weight:900;
    cursor:pointer;
    z-index:1002;
    width:40px;
    height:40px;
    display:flex;
    align-items:center;
    justify-content:center;
    line-height:1;
  }

  /* ===== SECTIONS / ITEMS ===== */
  .chapter-title{
    text-align:center;
    font-size:22px;
    font-weight:800;
    color:#000;
    margin-bottom:16px;
  }
  .columns-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    background:#eef4fa;
    border-radius:12px;
    padding:10px 4px;
    margin-bottom:18px;
    flex-wrap:nowrap;
  }
  .columns-header .col-name{
    flex:1 1 auto;
    text-align:right;
    font-size:13px;
    font-weight:800;
    color:var(--blue);
  }
  .columns-header .col-price{
    flex:0 0 auto;
    width:70px;
    text-align:center;
    font-size:13px;
    font-weight:800;
    color:var(--blue);
  }
  .columns-header .col-qty{
    flex:0 0 auto;
    width:112px;
    text-align:center;
    font-size:13px;
    font-weight:800;
    color:var(--blue);
    white-space:nowrap;
  }
  .section-block{
    background:#fff;
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:18px 16px;
    margin-bottom:18px;
  }
  .section-title{
    font-size:17px;
    font-weight:800;
    color:var(--blue);
    margin-bottom:12px;
    border-bottom:2px solid #eef4fa;
    padding-bottom:8px;
  }
  .subheader{
    font-size:15px;
    font-weight:700;
    color:#555;
    margin:10px 0 6px;
  }
  .item-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:10px 4px;
    border-bottom:1px solid #f0f0f0;
    flex-wrap:nowrap;
  }
  .item-row:last-child{ border-bottom:none; }
  .item-row.sub-item{ padding-right:18px; }
  .item-name-wrap{
    display:flex;
    flex-direction:row;
    align-items:center;
    flex-wrap:wrap;
    gap:8px;
    flex:1 1 auto;
    min-width:0;
  }
  .item-name-wrap.stacked{
    flex-direction:column;
    align-items:flex-start;
    gap:2px;
  }
  .item-name{
    font-size:15px;
    font-weight:700;
    color:#222;
    transition:color .2s ease;
    white-space:normal;
    word-break:break-word;
  }
  .item-name.active{
    color:var(--green-active);
  }
  .item-note{
    font-size:12px;
    color:#888;
    margin-top:0;
  }
  .item-price{
    font-size:14px;
    font-weight:700;
    color:#333;
    white-space:nowrap;
    width:70px;
    text-align:center;
    flex:0 0 auto;
  }
  .qty-control{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    width:112px;
    flex:0 0 auto;
  }
  .qty-btn{
    width:30px;
    height:30px;
    border-radius:8px;
    background:#eef4fa;
    color:#000;
    font-size:18px;
    font-weight:900;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:background .2s ease;
    flex-shrink:0;
  }
  .qty-btn:hover{ background:#dcebfa; }
  .qty-value{
    min-width:20px;
    text-align:center;
    font-weight:800;
    font-size:15px;
  }
  .note-only-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    padding:10px 4px;
    border-bottom:1px solid #f0f0f0;
    flex-wrap:nowrap;
  }
  .note-only-row:last-child{ border-bottom:none; }
  .note-only-row .item-name{
    flex:1 1 auto;
    min-width:0;
  }
  .note-only-row .item-note-edge{
    font-size:12px;
    color:#888;
    text-align:left;
    flex:0 0 auto;
    max-width:48%;
    white-space:normal;
  }

  /* ===== TOTAL BAR ===== */
  .total-wrap{
    text-align:center;
    margin-top:24px;
  }
  .total-price-text{
    font-size:18px;
    font-weight:800;
    color:#000;
    margin-bottom:16px;
  }
  .total-price-text span{
    font-size:23px;
    font-weight:900;
    color:var(--blue);
  }
  .order-button{
    display:inline-block;
    background:var(--whatsapp);
    color:#fff;
    font-weight:800;
    font-size:19px;
    padding:18px 48px;
    border-radius:999px;
    box-shadow:0 8px 20px rgba(37,211,102,0.35);
    transition:transform .2s ease, box-shadow .2s ease;
  }
  .order-button:hover{
    transform:translateY(-2px);
    box-shadow:0 10px 24px rgba(37,211,102,0.45);
  }
  .order-button:active{
    transform:translateY(0);
  }

  /* ===== PLACEHOLDER PRODUCT (years 3-5) ===== */
  .placeholder-product{
    background:#fff;
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    overflow:hidden;
    max-width:420px;
    margin:0 auto;
  }
  .placeholder-product .ph-image{
    width:100%;
    aspect-ratio:1/1;
    background:linear-gradient(135deg,#dbe9f5,#c7dff2);
    display:flex;
    align-items:center;
    justify-content:center;
    color:#4a6a85;
    font-weight:700;
    font-size:16px;
  }
  .placeholder-product .ph-body{
    padding:16px;
    text-align:center;
  }
  .placeholder-product .ph-title{
    font-size:17px;
    font-weight:800;
    margin-bottom:6px;
  }
  .placeholder-product .ph-price{
    font-size:15px;
    font-weight:700;
    color:var(--blue);
    margin-bottom:14px;
  }
  .placeholder-product .ph-btn{
    display:inline-block;
    background:var(--blue);
    color:#fff;
    font-weight:800;
    padding:10px 26px;
    border-radius:999px;
  }
  .empty-note{
    text-align:center;
    color:#777;
    font-size:15px;
    padding:20px;
  }

  /* ===== GPA CALCULATOR ===== */
  .gpa-subtabs{
    display:flex;
    justify-content:center;
    gap:12px;
    margin:0 0 20px;
    flex-wrap:wrap;
  }
  .gpa-table{
    background:#fff;
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:16px;
    margin-bottom:16px;
  }
  .gpa-header-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    font-weight:800;
    color:var(--blue);
    font-size:13.5px;
    padding-bottom:10px;
    border-bottom:2px solid #eef4fa;
    margin-bottom:8px;
  }
  .gpa-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:10px 0;
    border-bottom:1px solid #f0f0f0;
  }
  .gpa-row:last-child{ border-bottom:none; }
  .gpa-col-name{
    flex:1 1 auto;
    text-align:right;
  }
  .gpa-col-hours, .gpa-col-percent{
    flex:0 0 auto;
    width:92px;
    text-align:center;
  }
  .gpa-col-percent{
    margin-right:26px;
  }
  .gpa-cvalue{
    margin-right:26px;
  }
  .gpa-subject-name{
    flex:1 1 auto;
    font-weight:700;
    font-size:14px;
    color:#222;
  }
  .gpa-input{
    width:92px;
    flex:0 0 auto;
    text-align:center;
    padding:9px 4px;
    border:1.5px solid #dfe6ee;
    border-radius:10px;
    font-family:'Tajawal', sans-serif;
    font-size:14px;
    background:#f8fafc;
    color:#111;
  }
  .gpa-input:focus{
    outline:none;
    border-color:var(--blue-light);
    background:#fff;
  }
  .gpa-input::-webkit-outer-spin-button,
  .gpa-input::-webkit-inner-spin-button{
    -webkit-appearance:none;
    margin:0;
  }
  .gpa-input[type="number"]{
    -moz-appearance:textfield;
    appearance:textfield;
  }
  .gpa-percent-wrap{
    position:relative;
    width:92px;
    flex:0 0 auto;
  }
  .gpa-percent-wrap .gpa-input{
    width:100%;
    padding-left:22px;
  }
  .gpa-percent-sign{
    position:absolute;
    left:10px;
    top:50%;
    transform:translateY(-50%);
    font-size:13px;
    font-weight:700;
    color:#888;
    pointer-events:none;
  }
  .gpa-add-btn{
    display:block;
    background:var(--green-active);
    color:#fff;
    font-weight:800;
    font-size:15px;
    padding:12px 30px;
    border-radius:999px;
    margin:4px auto 14px;
    box-shadow:0 8px 20px rgba(22,163,74,0.3);
    transition:transform .2s ease;
  }
  .gpa-add-btn:hover{ transform:translateY(-2px); }
  .gpa-calc-btn{
    display:block;
    background:#000000;
    color:#fff;
    font-weight:800;
    font-size:16px;
    padding:14px 34px;
    border-radius:999px;
    margin:0 auto;
    box-shadow:0 8px 20px rgba(0,0,0,0.3);
    transition:transform .2s ease;
  }
  .gpa-calc-btn:hover{ transform:translateY(-2px); }
  .gpa-result{
    text-align:center;
    font-weight:800;
    font-size:17px;
    color:#000;
    margin-top:18px;
  }
  .gpa-year-title{
    font-size:15px;
    font-weight:800;
    color:var(--blue);
  }

  @media (max-width:480px){
    .header-top-row{ justify-content:space-between; margin-top:10px; }
    .whatsapp-btn span{ font-size:11px; }
    .instagram-btn span{ font-size:11px; }
    .whatsapp-btn, .instagram-btn{ padding:8px 10px; }
  }
</style>
</head>
<body>

<header class="site-header">
  <div class="header-center">
    <div class="logo"><span class="den">Den</span><span class="trust">Trust</span></div>
  </div>
  <div class="header-top-row">

/* ================== محاذاة عربية حقيقية بالمدّ (كشيدة) بدل تمديد الفراغات ================== */
function measureTextWidth(text, font){
  if (!measureTextWidth._canvas){
    measureTextWidth._canvas = document.createElement('canvas');
  }
  const ctx = measureTextWidth._canvas.getContext('2d');
  ctx.font = font;
  return ctx.measureText(text).width;
}

// الحروف التي لا تتصل بما بعدها (لا يصح وضع مدّ بعدها لأنها لا تتصل أصلا بالحرف التالي)
const NON_CONNECTING = new Set(['ا','أ','إ','آ','د','ذ','ر','ز','و','ؤ','ة','ى']);
const ARABIC_LETTER = /[\u0621-\u064A]/;

function insertKashida(text, count){
  if (count <= 0) return text;

  const positions = [];
  for (let i = 0; i < text.length - 1; i++){
    const c = text[i];
    const next = text[i + 1];
    if (c === ' ' || next === ' ') continue;
    if (!ARABIC_LETTER.test(c) || !ARABIC_LETTER.test(next)) continue;
    if (NON_CONNECTING.has(c)) continue;
    positions.push(i + 1);
  }

  if (positions.length === 0) return text;

  const allocation = new Array(positions.length).fill(0);
  for (let k = 0; k < count; k++){
    allocation[k % positions.length]++;
  }

  const combined = positions
    .map((pos, idx) => ({ pos, n: allocation[idx] }))
    .sort((a, b) => b.pos - a.pos);

  let result = text;
  combined.forEach(({ pos, n }) => {
    if (n > 0){
      result = result.slice(0, pos) + 'ـ'.repeat(n) + result.slice(pos);
    }
  });
  return result;
}

function applyKashidaJustify(){
  document.querySelectorAll('.kashida-pair').forEach(group => {
    const spans = Array.from(group.querySelectorAll('.menu-plain-line'));
    if (spans.length !== 2) return;

    spans.forEach(sp => {
      if (!sp.dataset.original) sp.dataset.original = sp.textContent;
    });

    const cs = getComputedStyle(spans[0]);
    const font = `${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
    const tatweelWidth = measureTextWidth('ـ', font) || 4;

    const widths = spans.map(sp => measureTextWidth(sp.dataset.original, font));
    const target = Math.max(...widths);

    spans.forEach((sp, idx) => {
      const original = sp.dataset.original;
      const deficit = target - widths[idx];
      if (deficit > 1){
        const count = Math.max(0, Math.round(deficit / tatweelWidth));
        sp.textContent = insertKashida(original, count);
      } else {
        sp.textContent = original;
      }
    });
  });
}

    renderCumulativeGpaMenu(gpaContent);
  });

  subtabs.appendChild(termBtn);
  subtabs.appendChild(cumBtn);
  container.appendChild(subtabs);
  container.appendChild(gpaContent);
}

let gpaSubjectCount = 0;

function percentToPoint(percent){
  if (percent >= 98) return 4;
  if (percent >= 95) return 3.75;
  if (percent >= 90) return 3.5;
  if (percent >= 85) return 3.25;
  if (percent >= 80) return 3;
  if (percent >= 75) return 2.75;
  if (percent >= 70) return 2.5;
  if (percent >= 65) return 2.25;
  if (percent >= 60) return 2;
  if (percent >= 55) return 1.75;
  if (percent >= 50) return 1.5;
  return 0;
}

function renderTermGpa(container){
  container.innerHTML = '';
  gpaSubjectCount = 0;

  const table = document.createElement('div');
  table.className = 'gpa-table';
  table.id = 'gpa-table';

  const header = document.createElement('div');
  header.className = 'gpa-header-row';
  header.innerHTML = `
    <span class="gpa-col-name"></span>
    <span class="gpa-col-hours">عدد الساعات</span>
    <span class="gpa-col-percent">الدرجة</span>
  `;
  table.appendChild(header);
  container.appendChild(table);

  for (let i = 0; i < 2; i++){
    addGpaSubjectRow(table);
  }

  const addBtn = document.createElement('button');
  addBtn.type = 'button';
  addBtn.className = 'gpa-add-btn';
  addBtn.textContent = 'إضافة مادة';
  addBtn.addEventListener('click', () => addGpaSubjectRow(table));
  container.appendChild(addBtn);

  const calcBtn = document.createElement('button');
  calcBtn.type = 'button';
  calcBtn.className = 'gpa-calc-btn';
  calcBtn.textContent = 'حساب المعدل';

  const resultEl = document.createElement('div');
  resultEl.className = 'gpa-result';
  resultEl.id = 'gpa-result';

  calcBtn.addEventListener('click', () => {
    const rows = table.querySelectorAll('.gpa-row');
    let weightedSum = 0;
    let totalHours = 0;
    let hasValidRow = false;

    rows.forEach(row => {
      const hoursInput = row.querySelector('.gpa-hours');
      const percentInput = row.querySelector('.gpa-percent');
      const hours = parseFloat(hoursInput.value);
      const percent = parseFloat(percentInput.value);
      if (!isNaN(hours) && !isNaN(percent)){
        const point = percentToPoint(percent);
        weightedSum += hours * point;
        totalHours += hours;
        hasValidRow = true;
      }
    });

    if (!hasValidRow || totalHours === 0){
      resultEl.textContent = 'يرجى إدخال عدد الساعات والمعدل لكل مادة أولاً';
      return;
    }

    const average = weightedSum / totalHours;
    const formatted = Number.isInteger(average) ? average : average.toFixed(2);
    resultEl.textContent = `معدلك الفصلي هو = ${formatted}`;
  });

  container.appendChild(calcBtn);
  container.appendChild(resultEl);
}

function addGpaSubjectRow(table){
  gpaSubjectCount += 1;
  const row = document.createElement('div');
  row.className = 'gpa-row';
  row.innerHTML = `
    <span class="gpa-subject-name">المادة ${gpaSubjectCount}</span>
    <input type="text" inputmode="decimal" class="gpa-input gpa-hours" placeholder="">
    <span class="gpa-percent-wrap">
      <input type="text" inputmode="decimal" class="gpa-input gpa-percent" placeholder="">
      <span class="gpa-percent-sign">%</span>
    </span>
  `;
  table.appendChild(row);
}

/* ================== حساب المعدل التراكمي ================== */
function renderCumulativeGpaMenu(container){
  container.innerHTML = '';

  const heading = document.createElement('div');
  heading.className = 'chapter-title';
  heading.textContent = 'املأ الفصول المنجزة فقط';
  heading.style.marginTop = '18px';
  heading.style.color = 'var(--blue)';
  container.appendChild(heading);

function renderCumulativeTable(container){
  const allTables = [];

  for (let y = 1; y <= 5; y++){
    const yearBlock = document.createElement('div');
    yearBlock.className = 'gpa-table';

    const header = document.createElement('div');
    header.className = 'gpa-header-row';
    header.innerHTML = `
      <span class="gpa-col-name gpa-year-title">${yearNames[y]}</span>
      <span class="gpa-col-hours kashida-pair">
        <span class="menu-plain-line">الساعات المنجزة</span>
        <span class="menu-plain-line">فصليا</span>
      </span>
      <span class="gpa-col-percent kashida-pair">
        <span class="menu-plain-line">المعدل الفصلي</span>
        <span class="menu-plain-line">النقطي</span>
      </span>
    `;
    yearBlock.appendChild(header);

    const semItems = [semesterNames[1], semesterNames[2], 'الفصل الصيفي (إن وجد)'];

    semItems.forEach(label => {
      const row = document.createElement('div');
      row.className = 'gpa-row';
      row.innerHTML = `
        <span class="gpa-subject-name">${label}</span>

        <input type="text" inputmode="decimal" class="gpa-input gpa-cvalue" placeholder="">
      `;
      yearBlock.appendChild(row);
    });

    container.appendChild(yearBlock);
    allTables.push(yearBlock);
  }

  applyKashidaJustify();

  const calcBtn = document.createElement('button');
  calcBtn.type = 'button';
  calcBtn.className = 'gpa-calc-btn';
  calcBtn.textContent = 'حساب المعدل';

  const resultEl = document.createElement('div');
  resultEl.className = 'gpa-result';

  calcBtn.addEventListener('click', () => {
    let weightedSum = 0;
    let totalHours = 0;
    let hasValidRow = false;

    allTables.forEach(block => {
      block.querySelectorAll('.gpa-row').forEach(row => {
        const hours = parseFloat(row.querySelector('.gpa-hours').value);
        const val = parseFloat(row.querySelector('.gpa-cvalue').value);
        if (!isNaN(hours) && !isNaN(val)){
          weightedSum += hours * val;
          totalHours += hours;
          hasValidRow = true;
        }
      });
    });

    if (!hasValidRow || totalHours === 0){
      resultEl.textContent = 'يرجى إدخال عدد الساعات والمعدل النقطي لكل فصل أولاً';
      return;
    }

    const average = weightedSum / totalHours;
    const formatted = Number.isInteger(average) ? average : average.toFixed(2);
    resultEl.textContent = `معدلك التراكمي هو = ${formatted}`;
  });

  container.appendChild(calcBtn);
  container.appendChild(resultEl);
}

/* ================== بناء تبويبات السنوات ================== */
const yearNames = {1:'السنة الأولى',2:'السنة الثانية',3:'السنة الثالثة',4:'السنة الرابعة',5:'السنة الخامسة'};
const yearsTabsEl = document.getElementById('years-tabs');
Object.keys(yearNames).forEach(y => {
  const btn = document.createElement('button');
  btn.className = 'year-tab';
  btn.textContent = yearNames[y];
  btn.addEventListener('click', () => selectYear(parseInt(y)));
  btn.dataset.year = y;
  yearsTabsEl.appendChild(btn);
});

function selectYear(year){
  selectedYear = year;
  selectedSemester = null;
  document.querySelectorAll('.year-tab').forEach(b => {
    b.classList.toggle('active', parseInt(b.dataset.year) === year);
  });
  document.getElementById('semesters-wrap').style.display = 'block';
  buildSemesterTabs();
  document.getElementById('content-area').innerHTML = '';
}

function buildSemesterTabs(){
  const wrap = document.getElementById('semesters-tabs');
  wrap.innerHTML = '';
  ['الفصل الأول','الفصل الثاني'].forEach((label, idx) => {
    const sem = idx + 1;
    const btn = document.createElement('button');
    btn.className = 'semester-tab';
    btn.textContent = label;
    btn.addEventListener('click', () => selectSemester(sem));
    btn.dataset.sem = sem;
    wrap.appendChild(btn);
  });
}

function selectSemester(sem){
  selectedSemester = sem;
  document.querySelectorAll('.semester-tab').forEach(b => {
    b.classList.toggle('active', parseInt(b.dataset.sem) === sem);
  });
  renderChapter(selectedYear, sem);
}

/* ================== عرض محتوى الفصل ================== */
function renderChapter(year, sem){
  const container = document.getElementById('content-area');
  container.innerHTML = '';
  const data = catalogData[year] && catalogData[year][sem];
  if (!data) return;

  if (data.type === 'message'){
    const box = document.createElement('div');
    box.className = 'message-box';
    box.textContent = data.text;
    container.appendChild(box);
    return;
  }

  if (data.type === 'placeholder'){
    container.innerHTML = `
      <div class="placeholder-product">
        <div class="ph-image">صورة المنتج (سيتم إضافتها لاحقاً)</div>
        <div class="ph-body">
          <div class="ph-title">اسم المنتج التجريبي</div>
          <div class="ph-price">السعر: 500 ل.س</div>
          <a class="ph-btn" href="#" onclick="return false;">اطلب الآن</a>
        </div>
      </div>
      <p class="empty-note">سيتم تحديث قائمة الأدوات الخاصة بهذا الفصل قريباً</p>
    `;
    return;
  }

  if (data.type === 'products'){
    currentQty = {};
    const chapterId = `y${year}s${sem}`;

    const galleryEl = buildGallery(data.images, chapterId);
    container.appendChild(galleryEl);

    const titleEl = document.createElement('div');
    titleEl.className = 'chapter-title';
    titleEl.textContent = data.title;
    container.appendChild(titleEl);

    let itemCounter = 0;
    data.sections.forEach((section, sIdx) => {
      const sectionEl = document.createElement('div');
      sectionEl.className = 'section-block';

      if (section.name){
        const sTitle = document.createElement('div');
        sTitle.className = 'section-title';
        sTitle.textContent = section.name;
        sectionEl.appendChild(sTitle);

        const columnsHeader = document.createElement('div');
        columnsHeader.className = 'columns-header';
        columnsHeader.innerHTML = `
          <span class="col-name">اسم الأداة</span>
          <span class="col-price">السعر</span>
          <span class="col-qty">الكمية</span>
        `;
        sectionEl.appendChild(columnsHeader);
      }

      section.items.forEach(item => {
        if (item.subheader){
          const sub = document.createElement('div');
          sub.className = 'subheader';
          sub.textContent = item.subheader;
          sectionEl.appendChild(sub);
          return;
        }

        if (item.noPrice){
          const row = document.createElement('div');
          row.className = 'note-only-row';
          row.innerHTML = `
            <span class="item-name">${item.name}</span>
            ${item.note ? `<span class="item-note-edge">${item.note}</span>` : ''}
          `;
          sectionEl.appendChild(row);
          return;
        }

        const itemId = `${chapterId}_i${itemCounter++}`;
        currentQty[itemId] = { qty: 0, price: DEFAULT_PRICE, name: item.name };

        const stacked = item.notePosition === 'below';
        const row = document.createElement('div');
        row.className = 'item-row' + (item.sub ? ' sub-item' : '');
        row.innerHTML = `
          <div class="item-name-wrap${stacked ? ' stacked' : ''}">
            <span class="item-name" id="name-${itemId}">${item.name}</span>
            ${item.note ? `<span class="item-note">${item.note}</span>` : ''}
          </div>
          <div class="item-price">${DEFAULT_PRICE} ل.س</div>
          <div class="qty-control">
            <button class="qty-btn" data-action="minus" data-id="${itemId}">−</button>
            <span class="qty-value" id="qty-${itemId}">0</span>
            <button class="qty-btn" data-action="plus" data-id="${itemId}">+</button>
          </div>
        `;
        sectionEl.appendChild(row);
      });

      container.appendChild(sectionEl);
    });

    const totalWrap = document.createElement('div');
    totalWrap.className = 'total-wrap';
    totalWrap.innerHTML = `
      <div class="total-price-text">السعر الإجمالي = <span id="total-${chapterId}">0 ل.س</span></div>
      <button type="button" class="order-button">اضغط هنا للطلب الآن</button>
    `;
    totalWrap.querySelector('.order-button').addEventListener('click', () => sendOrder(chapterId, year, sem));
    container.appendChild(totalWrap);

    container.querySelectorAll('.qty-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = btn.dataset.id;
        const action = btn.dataset.action;
        changeQty(id, action, chapterId);
      });
    });
  }
}

function changeQty(id, action, chapterId){
  const entry = currentQty[id];
  if (!entry) return;
  if (action === 'plus'){
    entry.qty += 1;
  } else if (action === 'minus' && entry.qty > 0){
    entry.qty -= 1;
  }
  document.getElementById(`qty-${id}`).textContent = entry.qty;
  const nameEl = document.getElementById(`name-${id}`);
  if (nameEl){
    nameEl.classList.toggle('active', entry.qty >= 1);
  }
  updateTotal(chapterId);
}

function updateTotal(chapterId){
  let total = 0;
  Object.values(currentQty).forEach(e => total += e.qty * e.price);
  const totalEl = document.getElementById(`total-${chapterId}`);
  if (totalEl) totalEl.textContent = `${total} ل.س`;
}

const semesterNames = {1:'الفصل الأول', 2:'الفصل الثاني'};

function sendOrder(chapterId, year, sem){
  const selectedItems = Object.values(currentQty).filter(e => e.qty > 0);
  if (selectedItems.length === 0){
    alert('يرجى اختيار كمية أداة واحدة على الأقل قبل الطلب');
    return;
  }
  let total = 0;
  let message = `مرحبا ، اود طلب المنتجات الآتية من ${yearNames[year]} ${semesterNames[sem]}:\n`;
  selectedItems.forEach(item => {
    message += `${item.name} ،الكمية: ${item.qty}\n`;
    total += item.qty * item.price;
  });
  message += `(مجموع الفاتورة = ${total} ل.س )`;
  const url = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(message)}`;
  window.open(url, '_blank');
}

/* ================== المعرض (Gallery) ================== */
function buildGallery(images, chapterId){
  const state = { index: 0 };
  const outer = document.createElement('div');
  outer.className = 'gallery-wrap';

  const wrap = document.createElement('div');
  wrap.className = 'gallery';

  const track = document.createElement('div');
  track.className = 'gallery-track';
  let dragged = false;

  images.forEach(img => {
    const slide = document.createElement('div');
    slide.className = 'gallery-slide';
    if (img.src){
      slide.innerHTML = `<img src="${img.src}" alt="${img.label || ''}" draggable="false">`;
    } else {
      slide.textContent = img.label || 'صورة المنتج';
    }
    slide.addEventListener('click', () => {
      if (dragged) return;
      openModal(images, state.index);
    });
    track.appendChild(slide);
  });
  wrap.appendChild(track);

  const dotsWrap = document.createElement('div');
  dotsWrap.className = 'gallery-dots';
  const dotEls = images.map((_, i) => {
    const dot = document.createElement('span');
    dot.className = 'gallery-dot' + (i === 0 ? ' active' : '');
    dotsWrap.appendChild(dot);
    return dot;
  });

  function setTranslate(px, animated){
    track.classList.toggle('snap', !!animated);
    track.style.transform = `translateX(${px}px)`;
  }

  function updateView(animated){
    const width = wrap.clientWidth;
    setTranslate(-state.index * width, animated);
    dotEls.forEach((d, i) => d.classList.toggle('active', i === state.index));
  }

  function goNext(){
    if (state.index < images.length - 1){
      state.index += 1;
      updateView(true);
    } else {
      updateView(true);
    }
  }
  function goPrev(){
    if (state.index > 0){
      state.index -= 1;
      updateView(true);
    } else {
      updateView(true);
    }
  }

  let startX = 0;
  let startY = 0;
  let dragStartTranslate = 0;
  let pointerDown = false;
  let horizontalLock = false;

  wrap.addEventListener('pointerdown', (e) => {
    pointerDown = true;
    dragged = false;
    horizontalLock = false;
    startX = e.clientX;
    startY = e.clientY;
    dragStartTranslate = -state.index * wrap.clientWidth;
    track.classList.remove('snap');
  });
  wrap.addEventListener('pointermove', (e) => {
    if (!pointerDown) return;
    const dx = e.clientX - startX;
    const dy = e.clientY - startY;
    if (!horizontalLock && Math.abs(dx) > 6){
      horizontalLock = Math.abs(dx) > Math.abs(dy);
    }
    if (Math.abs(dx) > 10) dragged = true;
    if (horizontalLock){
      track.style.transform = `translateX(${dragStartTranslate + dx}px)`;
    }
  });
  wrap.addEventListener('pointerup', (e) => {
    if (!pointerDown) return;
    pointerDown = false;
    const dx = e.clientX - startX;
    const width = wrap.clientWidth;
    if (horizontalLock && Math.abs(dx) > width * 0.15){
      if (dx < 0 && state.index < images.length - 1){
        state.index += 1;
      } else if (dx > 0 && state.index > 0){
        state.index -= 1;
      }
    }
    updateView(true);
    setTimeout(() => { dragged = false; }, 50);
  });
  wrap.addEventListener('pointercancel', () => {
    pointerDown = false;
    updateView(true);
  });
  wrap.addEventListener('pointerleave', () => {
    if (pointerDown){
      pointerDown = false;
      updateView(true);
    }
  });
  window.addEventListener('resize', () => updateView(false));

  outer.appendChild(wrap);
  if (images.length > 1){
    wrap.appendChild(dotsWrap);
  }
  updateView(false);
  return outer;
}

/* ================== المودال (تكبير الصورة مع Pinch-to-Zoom) ================== */
const modalOverlay = document.getElementById('modal-overlay');
const modalContent = document.getElementById('modal-content');
const modalClose = document.getElementById('modal-close');
const modalDots = document.getElementById('modal-dots');

function openModal(images, startIndex){
  const state = { index: startIndex };
  modalContent.innerHTML = '';
  modalDots.innerHTML = '';

  const track = document.createElement('div');
  track.className = 'gallery-track';

  const slides = images.map(img => {
    const slide = document.createElement('div');
    slide.className = 'gallery-slide';
    if (img.src){
      slide.innerHTML = `<img src="${img.src}" alt="${img.label || ''}" draggable="false">`;
    } else {
      slide.textContent = img.label || 'صورة المنتج';
    }
    track.appendChild(slide);
    return slide;
  });

  const dotEls = images.map((_, i) => {
    const dot = document.createElement('span');
    dot.className = 'gallery-dot' + (i === startIndex ? ' active' : '');
    modalDots.appendChild(dot);
    return dot;
  });
  modalDots.style.display = images.length > 1 ? 'flex' : 'none';

  modalContent.appendChild(track);

  let scale = 1;
  let panX = 0;
  let panY = 0;

  function activeImg(){
    return slides[state.index].querySelector('img');
  }

  function applyZoomTransform(){
    const img = activeImg();
    if (img){
      img.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
    }
  }

  function resetZoom(){
    scale = 1;
    panX = 0;
    panY = 0;
    applyZoomTransform();
  }

  function setTranslate(px, animated){
    track.classList.toggle('snap', !!animated);
    track.style.transform = `translateX(${px}px)`;
  }

  function updateView(animated){
    const width = modalContent.clientWidth;
    setTranslate(-state.index * width, animated);
    dotEls.forEach((d, i) => d.classList.toggle('active', i === state.index));
    resetZoom();
  }

  function goNext(){
    if (state.index < images.length - 1){
      state.index += 1;
    }
    updateView(true);
  }
  function goPrev(){
    if (state.index > 0){
      state.index -= 1;
    }
    updateView(true);
  }

  updateView(false);

  const pointers = new Map();
  let startX = 0;
  let startY = 0;
  let dragStartTranslate = 0;
  let pointerDown = false;
  let pinching = false;
  let horizontalLock = false;
  let initialDistance = 0;
  let initialScale = 1;
  let lastPanX = 0;
  let lastPanY = 0;

  function distanceBetween(p1, p2){
    return Math.hypot(p1.x - p2.x, p1.y - p2.y);
  }

  modalContent.addEventListener('pointerdown', (e) => {
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pointers.size === 1 && scale === 1){
      pointerDown = true;
      pinching = false;
      horizontalLock = false;
      startX = e.clientX;
      startY = e.clientY;
      dragStartTranslate = -state.index * modalContent.clientWidth;
      track.classList.remove('snap');
    } else if (pointers.size === 1 && scale > 1){
      pointerDown = false;
      startX = e.clientX;
      startY = e.clientY;
      lastPanX = panX;
      lastPanY = panY;
    } else if (pointers.size === 2){
      pointerDown = false;
      pinching = true;
      const pts = Array.from(pointers.values());
      initialDistance = distanceBetween(pts[0], pts[1]);
      initialScale = scale;
    }
  });

  modalContent.addEventListener('pointermove', (e) => {
    if (!pointers.has(e.pointerId)) return;
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

    if (pinching && pointers.size === 2){
      const pts = Array.from(pointers.values());
      const dist = distanceBetween(pts[0], pts[1]);
      if (initialDistance > 0){
        scale = Math.min(4, Math.max(1, initialScale * (dist / initialDistance)));
        applyZoomTransform();
      }
    } else if (pointerDown && pointers.size === 1 && scale === 1){
      const dx = e.clientX - startX;
      const dy = e.clientY - startY;
      if (!horizontalLock && Math.abs(dx) > 6){
        horizontalLock = Math.abs(dx) > Math.abs(dy);
      }
      if (horizontalLock){
        track.style.transform = `translateX(${dragStartTranslate + dx}px)`;
      }
    } else if (!pinching && pointers.size === 1 && scale > 1){
      panX = lastPanX + (e.clientX - startX);
      panY = lastPanY + (e.clientY - startY);
      applyZoomTransform();
    }
  });

  function endPointer(e){
    pointers.delete(e.pointerId);
    if (pointers.size === 0){
      if (pointerDown && scale === 1){
        const dx = e.clientX - startX;
        const width = modalContent.clientWidth;
        if (horizontalLock && Math.abs(dx) > width * 0.15){
          if (dx < 0 && state.index < images.length - 1){
            state.index += 1;
          } else if (dx > 0 && state.index > 0){
            state.index -= 1;
          }
        }
        updateView(true);
      }
      pointerDown = false;
      pinching = false;
      if (scale < 1){
        resetZoom();
      }
    } else if (pointers.size === 1){
      pinching = false;
      const remaining = Array.from(pointers.values())[0];
      startX = remaining.x;
      startY = remaining.y;
      lastPanX = panX;
      lastPanY = panY;
    }
  }

  modalContent.addEventListener('pointerup', endPointer);
  modalContent.addEventListener('pointercancel', endPointer);
  modalContent.addEventListener('pointerleave', endPointer);
  modalContent.addEventListener('dblclick', () => { resetZoom(); });
  window.addEventListener('resize', () => updateView(false));

  modalOverlay.classList.add('open');
}

modalClose.addEventListener('click', () => modalOverlay.classList.remove('open'));
modalOverlay.addEventListener('click', (e) => {
  if (e.target === modalOverlay) modalOverlay.classList.remove('open');
});
