<!DOCTYPE html>

<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DenTrust | مواد طب الأسنان الدراسية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #161616;
    --ink-soft: #5b6570;
    --line: #e3e8ee;
    --surface: #f6f9fb;
    --tint: #eef8ff;
    --brand-blue: #0ea5e9;
    --brand-blue-deep: #0b84bd;
    --whatsapp: #25D366;
    --whatsapp-deep: #1ebd5a;
    --radius: 10px;
    --max-width: 1100px;
  }

- { box-sizing: border-box; }

html, body {
margin: 0;
padding: 0;
}

body {
font-family: ‘Tajawal’, sans-serif;
color: var(–ink);
background: #ffffff;
line-height: 1.6;
-webkit-font-smoothing: antialiased;
}

a { text-decoration: none; color: inherit; }

button { font-family: inherit; cursor: pointer; }

:focus-visible {
outline: 3px solid var(–brand-blue);
outline-offset: 2px;
}

/* ––––– Header ––––– */

.site-header {
border-bottom: 1px solid var(–line);
padding: 18px 24px;
}

.header-grid {
max-width: var(–max-width);
margin: 0 auto;
display: grid;
grid-template-columns: 1fr auto 1fr;
align-items: center;
gap: 16px;
}

.tagline {
font-size: 14px;
font-weight: 500;
color: var(–ink);
justify-self: start;
letter-spacing: 0.2px;
}

.tagline .accent { color: var(–brand-blue); font-weight: 700; }

.logo {
justify-self: center;
font-size: 28px;
font-weight: 900;
white-space: nowrap;
}

.logo .den { color: #000000; }
.logo .trust { color: var(–brand-blue); }

.whatsapp-btn {
justify-self: end;
display: inline-flex;
align-items: center;
gap: 10px;
background: #ffffff;
border: 1.5px solid var(–whatsapp);
border-radius: 999px;
padding: 8px 16px 8px 10px;
transition: background 0.15s ease, transform 0.15s ease;
}

.whatsapp-btn:hover {
background: #f0fdf5;
transform: translateY(-1px);
}

.whatsapp-btn .wa-icon {
width: 30px;
height: 30px;
border-radius: 50%;
background: var(–whatsapp);
display: flex;
align-items: center;
justify-content: center;
flex-shrink: 0;
}

.whatsapp-btn .wa-icon svg {
width: 17px;
height: 17px;
fill: #ffffff;
}

.whatsapp-btn span {
color: #161616;
font-size: 14px;
font-weight: 700;
}

@media (max-width: 720px) {
.header-grid {
grid-template-columns: 1fr;
justify-items: center;
text-align: center;
gap: 10px;
}
.tagline { justify-self: center; font-size: 12px; }
.whatsapp-btn { justify-self: center; }
}

/* ––––– Hero / Section heading ––––– */

.hero {
max-width: var(–max-width);
margin: 0 auto;
padding: 56px 24px 8px;
text-align: center;
}

.hero h1 {
font-size: clamp(26px, 4vw, 38px);
font-weight: 900;
margin: 0 0 8px;
}

.hero p {
color: var(–ink-soft);
font-size: 15px;
margin: 0;
}

/* ––––– Year tabs ––––– */

.years-wrap {
max-width: var(–max-width);
margin: 32px auto 0;
padding: 0 24px;
}

.years-tabs {
display: flex;
flex-direction: row;
justify-content: center;
flex-wrap: wrap;
gap: 8px;
border-bottom: 1px solid var(–line);
padding-bottom: 0;
}

.year-tab {
background: none;
border: none;
padding: 14px 20px;
font-size: 16px;
font-weight: 700;
color: var(–ink-soft);
border-bottom: 3px solid transparent;
margin-bottom: -1px;
transition: color 0.15s ease, border-color 0.15s ease;
}

.year-tab:hover {
color: var(–ink);
}

.year-tab.active {
color: var(–brand-blue-deep);
border-bottom-color: var(–brand-blue);
}

.year-tab .num {
display: inline-block;
min-width: 22px;
height: 22px;
line-height: 22px;
border-radius: 50%;
background: var(–surface);
color: var(–ink-soft);
font-size: 12px;
margin-inline-start: 6px;
transition: background 0.15s ease, color 0.15s ease;
}

.year-tab.active .num {
background: var(–brand-blue);
color: #ffffff;
}

/* ––––– Chapter tabs ––––– */

.chapters-wrap {
max-width: var(–max-width);
margin: 22px auto 0;
padding: 0 24px;
display: none;
}

.chapters-wrap.visible {
display: block;
}

.chapters-tabs {
display: flex;
justify-content: center;
gap: 10px;
flex-wrap: wrap;
}

.chapter-tab {
background: var(–surface);
border: 1px solid var(–line);
border-radius: 999px;
padding: 9px 20px;
font-size: 14px;
font-weight: 500;
color: var(–ink);
transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
}

.chapter-tab:hover {
border-color: var(–brand-blue);
}

.chapter-tab.active {
background: var(–brand-blue);
border-color: var(–brand-blue);
color: #ffffff;
}

/* ––––– Products ––––– */

.products-wrap {
max-width: var(–max-width);
margin: 0 auto;
padding: 28px 24px 80px;
display: none;
}

.products-wrap.visible {
display: block;
}

.products-heading {
font-size: 14px;
font-weight: 700;
color: var(–ink-soft);
margin: 0 0 16px;
text-align: center;
}

.products-grid {
display: grid;
grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
gap: 18px;
}

.product-card {
border: 1px solid var(–line);
border-radius: var(–radius);
overflow: hidden;
background: #ffffff;
display: flex;
flex-direction: column;
}

.product-image {
aspect-ratio: 4 / 3;
background: var(–tint);
color: var(–brand-blue-deep);
display: flex;
align-items: center;
justify-content: center;
font-size: 13px;
font-weight: 500;
text-align: center;
padding: 12px;
}

.product-body {
padding: 14px 16px 16px;
display: flex;
flex-direction: column;
gap: 8px;
flex-grow: 1;
}

.product-title {
font-size: 15px;
font-weight: 700;
margin: 0;
}

.product-price {
font-size: 14px;
color: var(–brand-blue-deep);
font-weight: 700;
margin: 0;
}

.product-order-btn {
margin-top: auto;
background: var(–ink);
color: #ffffff;
border: none;
border-radius: 8px;
padding: 10px 14px;
font-size: 14px;
font-weight: 700;
text-align: center;
transition: background 0.15s ease;
}

.product-order-btn:hover {
background: var(–brand-blue-deep);
}

/* ––––– Footer ––––– */

.site-footer {
border-top: 1px solid var(–line);
padding: 20px 24px;
text-align: center;
font-size: 13px;
color: var(–ink-soft);
}

@media (prefers-reduced-motion: reduce) {
* {
transition: none !important;
}
}
</style>

</head>
<body>

<header class="site-header">
  <div class="header-grid">
    <div class="tagline">
      <span class="accent">D</span>ental.<span class="accent">E</span>asy.<span class="accent">N</span>oble.<span class="accent">TRUST</span>
    </div>
    <div class="logo"><span class="den">Den</span><span class="trust">Trust</span></div>
    <a class="whatsapp-btn" href="https://wa.me/966570291254" target="_blank" rel="noopener">
      <span class="wa-icon">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M17.6 6.32A8.8 8.8 0 0 0 12.02 3.5c-4.87 0-8.83 3.95-8.83 8.83a8.8 8.8 0 0 0 1.18 4.42L3.5 20.5l3.86-1.01a8.8 8.8 0 0 0 4.66 1.34h.01c4.87 0 8.83-3.95 8.83-8.83a8.78 8.78 0 0 0-2.87-6.68zm-5.58 13.6h-.01a7.34 7.34 0 0 1-3.74-1.02l-.27-.16-2.78.73.74-2.71-.18-.28a7.33 7.33 0 0 1-1.13-3.92c0-4.06 3.31-7.36 7.38-7.36a7.35 7.35 0 0 1 7.36 7.37c0 4.06-3.3 7.35-7.37 7.35zm4.04-5.51c-.22-.11-1.3-.64-1.5-.72-.2-.07-.35-.11-.5.11-.15.22-.57.72-.7.86-.13.15-.26.16-.48.05-.22-.11-.94-.35-1.79-1.11-.66-.59-1.11-1.32-1.24-1.54-.13-.22-.01-.34.1-.45.1-.1.22-.26.33-.39.11-.13.15-.22.22-.37.07-.15.04-.28-.02-.39-.06-.11-.5-1.2-.68-1.65-.18-.43-.36-.37-.5-.38h-.43c-.15 0-.39.06-.6.28-.2.22-.79.77-.79 1.87s.81 2.17.92 2.32c.11.15 1.6 2.44 3.87 3.42.54.23.96.37 1.29.48.54.17 1.03.15 1.42.09.43-.06 1.3-.53 1.49-1.04.18-.51.18-.94.13-1.03-.05-.09-.2-.15-.42-.26z"/></svg>
      </span>
      <span>(أطلب الآن عبر الواتساب)</span>
    </a>
  </div>
</header>

<section class="hero">
  <h1>(اختر السنة)</h1>
  <p>حدد سنتك الدراسية ثم الفصل، لعرض المواد الخاصة به</p>
</section>

<div class="years-wrap">
  <div class="years-tabs" id="yearsTabs" role="tablist"></div>
</div>

<div class="chapters-wrap" id="chaptersWrap">
  <div class="chapters-tabs" id="chaptersTabs" role="tablist"></div>
</div>

<div class="products-wrap" id="productsWrap">
  <p class="products-heading" id="productsHeading"></p>
  <div class="products-grid" id="productsGrid"></div>
</div>

<footer class="site-footer">
  جميع الحقوق محفوظة &copy; DenTrust
</footer>

<script>
  const WHATSAPP_NUMBER = "966570291254";

  const YEARS = [
    { id: "year1", label: "السنة الأولى" },
    { id: "year2", label: "السنة الثانية" },
    { id: "year3", label: "السنة الثالثة" },
    { id: "year4", label: "السنة الرابعة" },
    { id: "year5", label: "السنة الخامسة" }
  ];

  const CHAPTERS = [
    { id: "ch1", label: "الفصل الأول" },
    { id: "ch2", label: "الفصل الثاني" }
  ];

  const PRODUCTS = {
    year1: {
      ch1: [
        { title: "اسم المنتج التجريبي", price: "0.00 ريال", image: "صورة المنتج هنا" }
      ],
      ch2: [
        { title: "اسم المنتج التجريبي", price: "0.00 ريال", image: "صورة المنتج هنا" }
      ]
    },
    year2: {
      ch1: [
        { title: "اسم المنتج التجريبي", price: "0.00 ريال", image: "صورة المنتج هنا" }
      ],
      ch2: [
        { title: "اسم المنتج التجريبي", price: "0.00 ريال", image: "صورة المنتج هنا" }
      ]
    },
    year3: {
      ch1: [
        { title: "اسم المنتج التجريبي", price: "0.00 ريال", image: "صورة المنتج هنا" }
      ],
      ch2: [
        { title: "اسم المنتج التجريبي", price: "0.00 ريال", image: "صورة المنتج هنا" }
      ]
    },
    year4: {
      ch1: [
        { title: "اسم المنتج التجريبي", price: "0.00 ريال", image: "صورة المنتج هنا" }
      ],
      ch2: [
        { title: "اسم المنتج التجريبي", price: "0.00 ريال", image: "صورة المنتج هنا" }
      ]
    },
    year5: {
      ch1: [
        { title: "اسم المنتج التجريبي", price: "0.00 ريال", image: "صورة المنتج هنا" }
      ],
      ch2: [
        { title: "اسم المنتج التجريبي", price: "0.00 ريال", image: "صورة المنتج هنا" }
      ]
    }
  };

  let selectedYear = null;
  let selectedChapter = null;

  const yearsTabsEl = document.getElementById("yearsTabs");
  const chaptersWrapEl = document.getElementById("chaptersWrap");
  const chaptersTabsEl = document.getElementById("chaptersTabs");
  const productsWrapEl = document.getElementById("productsWrap");
  const productsHeadingEl = document.getElementById("productsHeading");
  const productsGridEl = document.getElementById("productsGrid");

  function buildYearTabs() {
    YEARS.forEach((year, index) => {
      const btn = document.createElement("button");
      btn.className = "year-tab";
      btn.setAttribute("role", "tab");
      btn.dataset.yearId = year.id;
      btn.innerHTML = year.label + '<span class="num">' + (index + 1) + '</span>';
      btn.addEventListener("click", () => selectYear(year.id));
      yearsTabsEl.appendChild(btn);
    });
  }

  function selectYear(yearId) {
    selectedYear = yearId;
    selectedChapter = null;

    document.querySelectorAll(".year-tab").forEach(el => {
      el.classList.toggle("active", el.dataset.yearId === yearId);
    });

    buildChapterTabs();
    chaptersWrapEl.classList.add("visible");
    productsWrapEl.classList.remove("visible");
  }

  function buildChapterTabs() {
    chaptersTabsEl.innerHTML = "";
    CHAPTERS.forEach(chapter => {
      const btn = document.createElement("button");
      btn.className = "chapter-tab";
      btn.setAttribute("role", "tab");
      btn.dataset.chapterId = chapter.id;
      btn.textContent = chapter.label;
      btn.addEventListener("click", () => selectChapter(chapter.id));
      chaptersTabsEl.appendChild(btn);
    });
  }

  function selectChapter(chapterId) {
    selectedChapter = chapterId;

    document.querySelectorAll(".chapter-tab").forEach(el => {
      el.classList.toggle("active", el.dataset.chapterId === chapterId);
    });

    renderProducts();
    productsWrapEl.classList.add("visible");
  }

  function renderProducts() {
    const yearLabel = YEARS.find(y => y.id === selectedYear).label;
    const chapterLabel = CHAPTERS.find(c => c.id === selectedChapter).label;

    productsHeadingEl.textContent = "مواد " + yearLabel + " - " + chapterLabel;

    const items = (PRODUCTS[selectedYear] && PRODUCTS[selectedYear][selectedChapter]) || [];

    productsGridEl.innerHTML = "";

    items.forEach(product => {
      const card = document.createElement("div");
      card.className = "product-card";

      const image = document.createElement("div");
      image.className = "product-image";
      image.textContent = product.image;

      const body = document.createElement("div");
      body.className = "product-body";

      const title = document.createElement("p");
      title.className = "product-title";
      title.textContent = product.title;

      const price = document.createElement("p");
      price.className = "product-price";
      price.textContent = product.price;

      const orderBtn = document.createElement("a");
      orderBtn.className = "product-order-btn";
      orderBtn.textContent = "اطلب الآن";
      orderBtn.href = "https://wa.me/" + WHATSAPP_NUMBER + "?text=" +
        encodeURIComponent("مرحباً، أرغب بطلب: " + product.title + " (" + yearLabel + " - " + chapterLabel + ")");
      orderBtn.target = "_blank";
      orderBtn.rel = "noopener";

      body.appendChild(title);
      body.appendChild(price);
      body.appendChild(orderBtn);

      card.appendChild(image);
      card.appendChild(body);

      productsGridEl.appendChild(card);
    });
  }

  buildYearTabs();
</script>

</body>
</html>
