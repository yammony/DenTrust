<style>
  :root{
    --blue:#00a8ff;
    --blue-light:#38bdf8;
    --black:#000000;
    --whatsapp:#25D366;
    --bg:#f5f8fb;
    --card-bg:#ffffff;
    --shadow:0 4px 18px rgba(0,0,0,0.08);
    --radius:16px;
    --green-active:#16a34a;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{
    width:100%;
    overflow-x:hidden;
  }
  body{
    font-family:'Tajawal', sans-serif;
    background:var(--bg);
    color:#111;
    direction:rtl;
    padding-bottom:60px;
  }
  a{text-decoration:none; color:inherit;}
  button{font-family:'Tajawal', sans-serif; cursor:pointer; border:none;}

  /* ===== HEADER ===== */
  .site-header{
    background:var(--card-bg);
    box-shadow:var(--shadow);
    padding:14px 16px 20px;
    position:relative;
    z-index:10;
  }
  .header-top-row{
    display:flex;
    justify-content:flex-end;
    align-items:center;
    margin-bottom:6px;
  }
  .whatsapp-btn{
    display:flex;
    align-items:center;
    gap:8px;
    background:#fff;
    border:2px solid var(--whatsapp);
    padding:8px 14px;
    border-radius:999px;
    box-shadow:var(--shadow);
    transition:transform .2s ease, background .2s ease;
  }
  .whatsapp-btn:hover{
    transform:translateY(-2px);
    background:#eafff1;
  }
  .whatsapp-btn .wa-icon{
    width:26px;
    height:26px;
    border-radius:50%;
    background:var(--whatsapp);
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
  }
  .whatsapp-btn .wa-icon svg{
    width:16px;
    height:16px;
    fill:#fff;
  }
  .whatsapp-btn span{
    color:#000;
    font-weight:700;
    font-size:14px;
    white-space:nowrap;
  }
  .header-center{
    text-align:center;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
  }
  .top-phrase{
    font-size:clamp(13px, 3vw, 17px);
    font-weight:700;
    color:#000;
    letter-spacing:.5px;
  }
  .top-phrase .hl{
    color:var(--blue-light);
  }
  .logo{
    font-size:clamp(28px, 7vw, 42px);
    font-weight:900;
    letter-spacing:1px;
  }
  .logo .den{color:var(--black);}
  .logo .trust{color:var(--blue-light);}

  /* ===== HERO / MAIN CONTENT ===== */
  .hero{
    text-align:center;
    padding:34px 16px 10px;
  }
  .university{
    font-size:clamp(18px, 4.5vw, 26px);
    font-weight:800;
    color:#000;
    margin-bottom:14px;
  }
  .main-title{
    font-size:clamp(20px, 5vw, 30px);
    font-weight:800;
    color:var(--blue);
    margin-bottom:22px;
  }

  .years-tabs{
    display:flex;
    flex-direction:row;
    flex-wrap:wrap;
    justify-content:center;
    gap:10px;
    padding:0 12px;
    margin-bottom:18px;
  }
  .year-tab{
    background:#fff;
    color:#333;
    font-weight:700;
    font-size:15px;
    padding:12px 18px;
    border-radius:999px;
    box-shadow:var(--shadow);
    transition:all .25s ease;
    border:2px solid transparent;
    white-space:nowrap;
  }
  .year-tab:hover{
    border-color:var(--blue-light);
  }
  .year-tab.active{
    background:linear-gradient(135deg, var(--blue), var(--blue-light));
    color:#fff;
    box-shadow:0 6px 16px rgba(0,168,255,0.35);
  }

  .semesters-wrap{
    max-width:900px;
    margin:0 auto;
    padding:0 16px;
  }
  .semester-title{
    text-align:center;
    font-size:18px;
    font-weight:700;
    color:#111;
    margin:18px 0 12px;
  }
  .semesters-tabs{
    display:flex;
    justify-content:center;
    gap:12px;
    margin-bottom:26px;
    flex-wrap:wrap;
  }
  .semester-tab{
    background:#fff;
    color:#333;
    font-weight:700;
    font-size:15px;
    padding:11px 24px;
    border-radius:12px;
    box-shadow:var(--shadow);
    border:2px solid transparent;
    transition:all .25s ease;
  }
  .semester-tab:hover{
    border-color:var(--blue-light);
  }
  .semester-tab.active{
    background:#000;
    color:#fff;
  }

  /* ===== CONTENT AREA ===== */
  #content-area{
    max-width:900px;
    margin:0 auto;
    padding:0 16px 40px;
  }

  .message-box{
    background:#fff;
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:40px 20px;
    text-align:center;
    font-size:20px;
    font-weight:700;
    color:var(--green-active);
    line-height:1.8;
  }

  /* ===== GALLERY ===== */
  .gallery{
    position:relative;
    width:100%;
    aspect-ratio:16/8;
    border-radius:var(--radius);
    overflow:hidden;
    box-shadow:var(--shadow);
    margin-bottom:22px;
    background:#dbe9f5;
  }
  .gallery-track{
    display:flex;
    width:100%;
    height:100%;
    transition:transform .35s ease;
  }
  .gallery-slide{
    min-width:100%;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(135deg,#dbe9f5,#c7dff2);
    font-size:16px;
    font-weight:700;
    color:#4a6a85;
    cursor:zoom-in;
    text-align:center;
    padding:10px;
  }
  .gallery-slide img{
    width:100%;
    height:100%;
    object-fit:cover;
  }
  .gallery-arrow{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    width:42px;
    height:42px;
    border-radius:50%;
    background:rgba(255,255,255,0.9);
    box-shadow:var(--shadow);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:20px;
    font-weight:900;
    color:#000;
    z-index:3;
    transition:opacity .2s ease;
  }
  .gallery-arrow.right{ right:14px; }
  .gallery-arrow.left{ left:14px; }
  .gallery-arrow.hidden{ display:none; }

  /* ===== MODAL ===== */
  .modal-overlay{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.9);
    z-index:1000;
    align-items:center;
    justify-content:center;
  }
  .modal-overlay.open{ display:flex; }
  .modal-content{
    position:relative;
    width:92%;
    max-width:800px;
    aspect-ratio:16/10;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .modal-content .gallery-slide{
    border-radius:12px;
  }
  .modal-close{
    position:absolute;
    top:-42px;
    left:0;
    color:#fff;
    font-size:30px;
    font-weight:900;
    cursor:pointer;
  }

  /* ===== SECTIONS / ITEMS ===== */
  .chapter-title{
    text-align:center;
    font-size:22px;
    font-weight:800;
    color:#000;
    margin-bottom:22px;
  }
  .section-block{
    background:#fff;
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:18px 16px;
    margin-bottom:18px;

  .section-title{
    font-size:17px;
    font-weight:800;
    color:var(--blue);
    margin-bottom:12px;
    border-bottom:2px solid #eef4fa;
    padding-bottom:8px;
  }
  .subheader{
    font-size:15px;
    font-weight:700;
    color:#555;
    margin:10px 0 6px;
  }
  .item-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:10px 4px;
    border-bottom:1px solid #f0f0f0;
    flex-wrap:wrap;
  }
  .item-row:last-child{ border-bottom:none; }
  .item-row.sub-item{ padding-right:18px; }
  .item-name-wrap{
    display:flex;
    flex-direction:column;
    flex:1 1 auto;
    min-width:120px;
  }
  .item-name{
    font-size:15px;
    font-weight:700;
    color:#222;
    transition:color .2s ease;
  }
  .item-name.active{
    color:var(--green-active);
  }
  .item-note{
    font-size:12px;
    color:#888;
    margin-top:2px;
  }
  .item-price{
    font-size:14px;
    font-weight:700;
    color:#333;
    white-space:nowrap;
    min-width:80px;
    text-align:center;
  }
  .qty-control{
    display:flex;
    align-items:center;
    gap:6px;
  }
  .qty-btn{
    width:30px;
    height:30px;
    border-radius:8px;
    background:#eef4fa;
    color:#000;
    font-size:18px;
    font-weight:900;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:background .2s ease;

  .qty-btn:hover{ background:#dcebfa; }
  .qty-value{
    min-width:24px;
    text-align:center;
    font-weight:800;
    font-size:15px;
  }
  .note-only-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px 4px;
    border-bottom:1px solid #f0f0f0;
    flex-wrap:wrap;
  }
  .note-only-row:last-child{ border-bottom:none; }

    background:#000;
    color:#fff;
    border-radius:var(--radius);
    padding:18px 20px;
    text-align:center;
    margin-top:20px;
    box-shadow:var(--shadow);
    transition:transform .2s ease;
  }
  .total-bar:hover{ transform:translateY(-2px); }
  .total-bar .total-label{
    font-size:15px;
    font-weight:700;
    color:#fff;
    margin-bottom:4px;
  }
  .total-bar .total-amount{
    font-size:20px;
    font-weight:900;
    color:#fff;
    margin-bottom:10px;
  }

    font-size:15px;
    font-weight:800;
    color:#fff;

    justify-content:center;

    font-weight:700;

  .placeholder-product .ph-title{

    font-weight:800;

  .placeholder-product .ph-price{
    font-size:15px;
    font-weight:700;
    color:var(--blue);
    margin-bottom:14px;

    background:var(--blue);

    font-weight:800;

  }
  .empty-note{
    text-align:center;
    color:#777;
    font-size:15px;
    padding:20px;
  }

  @media (max-width:480px){
    .header-top-row{ justify-content:center; margin-bottom:10px; }
    .whatsapp-btn span{ font-size:12px; }
  }

</head>

            { name: 'لوحين مزج', noPrice: true, note: 'تم ذكره في مادة الجزئية 1' },
            { name: 'سباتيول', noPrice: true, note: 'تم ذكره في مادة الجزئية 1' },
            { name: 'أداة تبطين' },
            { name: 'سن اكريل محضر اي صنف', note: 'يتم عمله في جلسة مادة المداواة1' }
          ]
        }
      ]
    }
  },
  3: {
    1: { type: 'placeholder' },
    2: { type: 'placeholder' }
  },
  4: {
    1: { type: 'placeholder' },
    2: { type: 'placeholder' }
  },
  5: {
    1: { type: 'placeholder' },
    2: { type: 'placeholder' }
  }
};

const DEFAULT_PRICE = 500;
let selectedYear = null;
let selectedSemester = null;
let currentQty = {}; // key -> qty

/* ================== بناء تبويبات السنوات ================== */
const yearNames = {1:'السنة الأولى',2:'السنة الثانية',3:'السنة الثالثة',4:'السنة الرابعة',5:'السنة الخامسة'};
const yearsTabsEl = document.getElementById('years-tabs');
Object.keys(yearNames).forEach(y => {
  const btn = document.createElement('button');
  btn.className = 'year-tab';
  btn.textContent = yearNames[y];
  btn.addEventListener('click', () => selectYear(parseInt(y)));
  btn.dataset.year = y;
  yearsTabsEl.appendChild(btn);
});

function selectYear(year){
  selectedYear = year;
  selectedSemester = null;
  document.querySelectorAll('.year-tab').forEach(b => {
    b.classList.toggle('active', parseInt(b.dataset.year) === year);
  });
  document.getElementById('semesters-wrap').style.display = 'block';
  buildSemesterTabs();
  document.getElementById('content-area').innerHTML = '';
}

function buildSemesterTabs(){
  const wrap = document.getElementById('semesters-tabs');
  wrap.innerHTML = '';
  ['الفصل الأول','الفصل الثاني'].forEach((label, idx) => {
    const sem = idx + 1;
    const btn = document.createElement('button');
    btn.className = 'semester-tab';
    btn.textContent = label;
    btn.addEventListener('click', () => selectSemester(sem));
    btn.dataset.sem = sem;
    wrap.appendChild(btn);
  });
}

function selectSemester(sem){
  selectedSemester = sem;
  document.querySelectorAll('.semester-tab').forEach(b => {
    b.classList.toggle('active', parseInt(b.dataset.sem) === sem);
  });
  renderChapter(selectedYear, sem);
}

/* ================== عرض محتوى الفصل ================== */
function renderChapter(year, sem){
  const container = document.getElementById('content-area');
  container.innerHTML = '';
  const data = catalogData[year] && catalogData[year][sem];
  if (!data) return;

  if (data.type === 'message'){
    const box = document.createElement('div');
    box.className = 'message-box';
    box.textContent = data.text;
    container.appendChild(box);
    return;
  }

  if (data.type === 'placeholder'){
    container.innerHTML = `
      <div class="placeholder-product">
        <div class="ph-image">صورة المنتج (سيتم إضافتها لاحقاً)</div>
        <div class="ph-body">
          <div class="ph-title">اسم المنتج التجريبي</div>
          <div class="ph-price">السعر: 500 ل.س</div>
          <a class="ph-btn" href="#" onclick="return false;">اطلب الآن</a>
        </div>
      </div>
      <p class="empty-note">سيتم تحديث قائمة الأدوات الخاصة بهذا الفصل قريباً</p>
    `;
    return;
  }

  if (data.type === 'products'){
    currentQty = {};
    const chapterId = `y${year}s${sem}`;

    const galleryEl = buildGallery(data.images, chapterId);
    container.appendChild(galleryEl);

    const titleEl = document.createElement('div');
    titleEl.className = 'chapter-title';
    titleEl.textContent = data.title;
    container.appendChild(titleEl);

    let itemCounter = 0;
    data.sections.forEach((section, sIdx) => {
      const sectionEl = document.createElement('div');
      sectionEl.className = 'section-block';

      if (section.name){
        const sTitle = document.createElement('div');
        sTitle.className = 'section-title';
        sTitle.textContent = section.name;
        sectionEl.appendChild(sTitle);
      }

      section.items.forEach(item => {
        if (item.subheader){
          const sub = document.createElement('div');
          sub.className = 'subheader';
          sub.textContent = item.subheader;
          sectionEl.appendChild(sub);
          return;
        }

        if (item.noPrice){
          const row = document.createElement('div');
          row.className = 'note-only-row';
          row.innerHTML = `
            <div class="item-name-wrap">
              <span class="item-name">${item.name}</span>
              ${item.note ? `<span class="item-note">${item.note}</span>` : ''}
            </div>
          `;
          sectionEl.appendChild(row);
          return;
        }

        const itemId = `${chapterId}_i${itemCounter++}`;
        currentQty[itemId] = { qty: 0, price: DEFAULT_PRICE, name: item.name };

        const row = document.createElement('div');
        row.className = 'item-row' + (item.sub ? ' sub-item' : '');
        row.innerHTML = `
          <div class="item-name-wrap">
            <span class="item-name" id="name-${itemId}">${item.name}</span>
            ${item.note ? `<span class="item-note">${item.note}</span>` : ''}
          </div>
          <div class="item-price">${DEFAULT_PRICE} ل.س</div>
          <div class="qty-control">
            <button class="qty-btn" data-action="minus" data-id="${itemId}">−</button>
            <span class="qty-value" id="qty-${itemId}">0</span>
            <button class="qty-btn" data-action="plus" data-id="${itemId}">+</button>
          </div>
        `;
        sectionEl.appendChild(row);
      });

      container.appendChild(sectionEl);
    });

    const totalBar = document.createElement('div');
    totalBar.className = 'total-bar';
    totalBar.innerHTML = `
      <div class="total-label">السعر الإجمالي</div>
      <div class="total-amount" id="total-${chapterId}">0 ل.س</div>
      <div class="order-cta">اضغط هنا للطلب الآن</div>
    `;
    totalBar.addEventListener('click', () => sendOrder(chapterId, data.title));
    container.appendChild(totalBar);

    container.querySelectorAll('.qty-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = btn.dataset.id;
        const action = btn.dataset.action;
        changeQty(id, action, chapterId);
      });
    });
  }
}

function changeQty(id, action, chapterId){
  const entry = currentQty[id];
  if (!entry) return;
  if (action === 'plus'){
    entry.qty += 1;
  } else if (action === 'minus' && entry.qty > 0){
    entry.qty -= 1;
  }
  document.getElementById(`qty-${id}`).textContent = entry.qty;
  const nameEl = document.getElementById(`name-${id}`);
  if (nameEl){
    nameEl.classList.toggle('active', entry.qty >= 1);
  }
  updateTotal(chapterId);
}

function updateTotal(chapterId){
  let total = 0;
  Object.values(currentQty).forEach(e => total += e.qty * e.price);
  const totalEl = document.getElementById(`total-${chapterId}`);
  if (totalEl) totalEl.textContent = `${total} ل.س`;
}

function sendOrder(chapterId, chapterTitle){
  const selectedItems = Object.values(currentQty).filter(e => e.qty > 0);
  if (selectedItems.length === 0){
    alert('يرجى اختيار كمية أداة واحدة على الأقل قبل الطلب');
    return;
  }
  let total = 0;
  let message = 'مرحبا ، اود طلب المنتجات الآتية:\n';
  selectedItems.forEach(item => {
    message += `${item.name} ،الكمية: ${item.qty}\n`;
    total += item.qty * item.price;
  });
  message += `(مجموع الفاتورة = ${total} ل.س )`;
  const url = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(message)}`;
  window.open(url, '_blank');
}

/* ================== المعرض (Gallery) ================== */
function buildGallery(images, chapterId){
  const state = { index: 0 };
  const wrap = document.createElement('div');
  wrap.className = 'gallery';

  const track = document.createElement('div');
  track.className = 'gallery-track';
  images.forEach(img => {
    const slide = document.createElement('div');
    slide.className = 'gallery-slide';
    if (img.src){
      slide.innerHTML = `<img src="${img.src}" alt="${img.label || ''}">`;
    } else {
      slide.textContent = img.label || 'صورة المنتج';
    }
    slide.addEventListener('click', () => openModal(images, state.index));
    track.appendChild(slide);
  });
  wrap.appendChild(track);

  const rightArrow = document.createElement('div');
  rightArrow.className = 'gallery-arrow right';
  rightArrow.textContent = '›';
  const leftArrow = document.createElement('div');
  leftArrow.className = 'gallery-arrow left';
  leftArrow.textContent = '‹';

  function updateArrows(){
    rightArrow.classList.toggle('hidden', state.index >= images.length - 1);
    leftArrow.classList.toggle('hidden', state.index <= 0);
    track.style.transform = `translateX(${state.index * 100}%)`;
  }

  rightArrow.addEventListener('click', (e) => {
    e.stopPropagation();
    if (state.index < images.length - 1){
      state.index += 1;
      updateArrows();
    }
  });
  leftArrow.addEventListener('click', (e) => {
    e.stopPropagation();
    if (state.index > 0){
      state.index -= 1;
      updateArrows();
    }
  });

  wrap.appendChild(rightArrow);
  wrap.appendChild(leftArrow);
  updateArrows();
  return wrap;
}

/* ================== المودال (تكبير الصورة) ================== */
const modalOverlay = document.getElementById('modal-overlay');
const modalContent = document.getElementById('modal-content');
const modalClose = document.getElementById('modal-close');

function openModal(images, startIndex){
  const state = { index: startIndex };
  modalContent.innerHTML = '';

  const slideEl = document.createElement('div');
  slideEl.className = 'gallery-slide';
  slideEl.style.width = '100%';
  slideEl.style.height = '100%';

  function renderSlide(){
    const img = images[state.index];
    if (img.src){
      slideEl.innerHTML = `<img src="${img.src}" alt="${img.label || ''}" style="width:100%;height:100%;object-fit:contain;">`;
    } else {
      slideEl.textContent = img.label || 'صورة المنتج';
    }
    rightArrow.classList.toggle('hidden', state.index >= images.length - 1);
    leftArrow.classList.toggle('hidden', state.index <= 0);
  }

  const rightArrow = document.createElement('div');
  rightArrow.className = 'gallery-arrow right';
  rightArrow.textContent = '›';
  rightArrow.addEventListener('click', (e) => {
    e.stopPropagation();
    if (state.index < images.length - 1){
      state.index += 1;
      renderSlide();
    }
  });

  const leftArrow = document.createElement('div');
  leftArrow.className = 'gallery-arrow left';
  leftArrow.textContent = '‹';
  leftArrow.addEventListener('click', (e) => {
    e.stopPropagation();
    if (state.index > 0){
      state.index -= 1;
      renderSlide();
    }
  });

  modalContent.appendChild(slideEl);
  modalContent.appendChild(rightArrow);
  modalContent.appendChild(leftArrow);
  renderSlide();

  modalOverlay.classList.add('open');
}

modalClose.addEventListener('click', () => modalOverlay.classList.remove('open'));
modalOverlay.addEventListener('click', (e) => {
  if (e.target === modalOverlay) modalOverlay.classList.remove('open');
});
</script>
